<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
        <script src="studentCard.js"></script>

        <div class="card">
    <div class="card-photo">
        <img src="image.jpg">
    </div>

    <div class="card-info">
        <div class="card-field">
            <span class="label">Name: Eva</span>
            <span class="value name-val"></span>
        </div>
        <div class="card-field">
            <span class="label">Age: 17</span>
            <span class="value age-val"></span>
        </div>
        <div class="card-field">
            <span class="label">Faculty: programing</span>
            <span class="value faculty-val"></span>
        </div>
        <div class="card-field">
            <span class="label">Year: 2</span>
            <span class="value year-val"></span>
        </div>
    </div>
</div>


</body>
</html>
